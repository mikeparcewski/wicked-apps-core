[package]
name = "apps-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared kernel for the wicked-estate-universe apps (governance/orchestration/council/agent): estate re-exports, node/edge-kind constants, the cross-app event catalog, ConformanceClaim, the store seam, and the ToNode/FromNode round-trip. Its own repo so each app depends on it via a pinned version (polyrepo)."

[dependencies]
wicked-estate-core = { path = "../wicked-estate/crates/wicked-estate-core", version = "0.12.0" }
wicked-estate-store = { path = "../wicked-estate/crates/wicked-estate-store", version = "0.12.0" }
# The `wicked-estate` lib helpers; the emit seam it carries is binary-only, so apps-core ships its own.
wicked-estate = { path = "../wicked-estate/crates/wicked-estate", version = "0.12.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
