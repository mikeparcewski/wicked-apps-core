[package]
name = "wicked-apps-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mikeparcewski/wicked-apps-core"
keywords = ["wicked", "agents", "ai", "estate"]
categories = ["development-tools"]
description = "DEPRECATED: superseded by wicked-estate v0.13+. See https://github.com/mikeparcewski/wicked-estate"
publish = false

[dependencies]
wicked-estate-core = "0.12.0"
wicked-estate-store = "0.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
